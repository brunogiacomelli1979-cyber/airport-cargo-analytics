name: Qualidade e publicação
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    name: Dados, cálculos, interface e acessibilidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Validar CSVs e testes Python
        run: |
          python scripts/validate_data.py --output evidence/quality-summary.json
          python -m unittest discover -s tests -v
      - name: Validar JavaScript e reconciliação independente
        run: |
          node --check assets/dashboard.js
          node --check assets/analytics.js
          npm test
      - run: npx playwright install --with-deps chromium
      - name: Testar quatro resoluções, filtros, exportações e acessibilidade
        run: npm run test:ui
        env:
          SCREENSHOT_DIR: evidence/screenshots
      - name: Gerar e conferir pacote estático
        run: |
          npm run vendor
          git diff --exit-code -- assets/vendor
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: |
            evidence/
            playwright-report/
            test-results/
          retention-days: 30
  pages:
    name: Publicar GitHub Pages
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar somente arquivos públicos
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        name: Publicar versão validada
        uses: actions/deploy-pages@v4
